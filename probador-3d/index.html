<meta charset="utf-8">
<title>Probador 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: probador de boutique — escenario 3D a la izquierda, armario por categorías a la derecha (apilado en el celular) */
:root {
  --bg: #f5f1f2;
  --surface: #ffffff;
  --ink: #241b1e;
  --muted: #76696d;
  --line: #e6dcdf;
  --accent: #9e2f47;
  --accent-ink: #ffffff;
  --accent-soft: #f6e4e8;
  --stage-a: #fbf8f8;
  --stage-b: #e9dfe2;
  --font-display: "Bodoni Moda", "Didot", "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141012; --surface: #1d181a; --ink: #f2eaed; --muted: #a99ca1; --line: #352c30;
    --accent: #e27a90; --accent-ink: #1d0a10; --accent-soft: #3a2229;
    --stage-a: #2a2326; --stage-b: #141012; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141012; --surface: #1d181a; --ink: #f2eaed; --muted: #a99ca1; --line: #352c30;
  --accent: #e27a90; --accent-ink: #1d0a10; --accent-soft: #3a2229;
  --stage-a: #2a2326; --stage-b: #141012; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px 16px;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .mark { font-family: var(--font-display); font-style: italic; font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
.brand .sub { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 5px 11px; font-size: 13px; }

.stage { min-height: 0; min-width: 0; }
#viewer {
  position: relative; height: 100%; border-radius: var(--r); overflow: hidden;
  background: radial-gradient(120% 80% at 50% 30%, var(--stage-a), var(--stage-b));
  touch-action: none;
}
#viewer canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#viewer canvas:active { cursor: grabbing; }
.worn { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 12px; font-weight: 600; backdrop-filter: blur(6px); }
.chip button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; color: var(--muted); line-height: 1; }
.chip button:hover { background: var(--accent-soft); color: var(--ink); }
.rot { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.views button { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 90%, transparent); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.angle { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--muted); font-weight: 600; flex: 1 1 200px; max-width: 320px; }
.angle input { flex: 1; min-width: 0; accent-color: var(--accent); }
.angle output { font-variant-numeric: tabular-nums; width: 3.2ch; text-align: right; color: var(--ink); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

.panel { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; flex-shrink: 0; }
.tabs button { flex-shrink: 0; border: 0; background: transparent; border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.tabs .n { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); }
.pane { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.pane-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin: 0; text-wrap: balance; }
.pane-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.card { position: relative; }
.card .pick { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.card .pick:hover { border-color: var(--muted); }
.card.on .pick { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: var(--bg); display: block; }
.card img.cut { object-fit: contain; padding: 6px; }
.card .nm { font-weight: 600; font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.card .ty { font-size: 11px; color: var(--muted); }
.card .tag { position: absolute; top: 10px; left: 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-radius: 6px; color: var(--muted); }
.card .on-badge { position: absolute; top: 10px; right: 10px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
.card .del { margin-top: 4px; width: 100%; border: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 3px; border-radius: 6px; }
.card .del:hover, .card .del.confirm { color: var(--accent); background: var(--accent-soft); }

details.add { border: 1px dashed var(--line); border-radius: 12px; }
details.add[open] { border-style: solid; }
details.add summary { cursor: pointer; padding: 12px 14px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px; }
details.add summary::-webkit-details-marker { display: none; }
details.add summary::before { content: "+"; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
details.add[open] summary::before { content: "–"; }
.add-form { display: flex; flex-direction: column; gap: 12px; padding: 0 14px 14px; }
.drop { display: grid; place-items: center; text-align: center; min-height: 120px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 13px; cursor: pointer; overflow: hidden; padding: 10px; }
.drop img { max-height: 200px; border-radius: 8px; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
.drop.small { min-height: 72px; }
.drop.small img { max-height: 110px; }
.photos { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.photos .field > label { margin-bottom: 0; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .field legend { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); padding: 0; }
.field input[type="text"], .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; }
.field input[type="file"] { font-size: 12px; max-width: 100%; }
fieldset.field { border: 0; margin: 0; padding: 0; }
.radios { display: flex; flex-wrap: wrap; gap: 6px; }
.radios label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
.radios label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type="color"] { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); cursor: pointer; }
.help { font-size: 12px; color: var(--muted); margin: 0; }
.err { color: var(--accent); font-weight: 600; font-size: 13px; margin: 0; }

.photo-box { border-radius: 12px; background: var(--bg); overflow: hidden; display: grid; place-items: center; min-height: 160px; }
.photo-box canvas { display: block; max-width: 100%; cursor: crosshair; }
.photo-box label { padding: 24px; text-align: center; color: var(--muted); cursor: pointer; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.swatches input[type="color"] { width: 44px; }
.range { display: flex; align-items: center; gap: 10px; }
.range input { flex: 1; min-width: 0; accent-color: var(--accent); }
.range output { font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right; font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.suggest { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.suggest h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 19px; }
.suggest ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.suggest li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.suggest li img { width: 36px; height: 44px; object-fit: contain; border-radius: 6px; background: var(--bg); }
.suggest li .k { font-size: 11px; color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.week-nav strong { font-size: 14px; font-variant-numeric: tabular-nums; }
.days { display: flex; flex-direction: column; gap: 8px; }
.day { display: grid; grid-template-columns: 52px 54px minmax(0, 1fr); gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.day.today { border-color: var(--accent); }
.day .dt { text-align: center; line-height: 1.1; }
.day .dt b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.day .dt span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.day .ph { width: 54px; height: 72px; border-radius: 8px; background: var(--bg); object-fit: cover; display: grid; place-items: center; color: var(--muted); font-size: 18px; }
.day p { margin: 0 0 6px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.day .warn { color: var(--accent); font-weight: 600; }
.stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat div { background: var(--bg); border-radius: 10px; padding: 10px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.looks { display: flex; flex-direction: column; gap: 10px; }
.look { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; align-items: center; }
.look img { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; background: var(--bg); }
.look h3 { margin: 0; font-size: 15px; }
.look p { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
.look .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; border: 1px dashed var(--line); border-radius: 12px; }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 820px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; }
  #viewer { height: 64svh; min-height: 380px; }
  .panel { overflow: visible; }
  .pane { overflow: visible; }
  .brand .mark { font-size: 26px; }
}
@media (max-width: 560px) {
  .worn { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark">Probador</span><span class="sub">Armario 3D</span></div>
    <div class="top-actions"><button id="uploadBtn" class="btn" type="button">Subir prenda</button><button id="saveLook" class="btn primary" type="button">Guardar look</button></div>
  </header>

  <section class="stage" aria-label="Vista de la modelo">
    <div id="viewer">
      <div class="loading" id="loading">Preparando el probador…</div>
      <div class="worn" id="worn" aria-live="polite"></div>
      <div class="rot">
        <div class="views">
          <button type="button" data-view="0">Frente</button>
          <button type="button" data-view="90">Perfil</button>

        <label class="angle" for="angle"><span>Ángulo</span><input id="angle" type="range" min="0" max="359" value="0"><output id="angleOut">0°</output></label>

  </section>

  <aside class="panel" aria-label="Armario">

    <div id="pane" class="pane" role="tabpanel"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s, el = document) => el.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- Catálogo ---------------- */
const CATS = {
  top:     { label: 'Parte superior', tab: 'Superior', types: { camiseta: 'Camiseta', blusa: 'Blusa manga larga', crop: 'Top corto', chaqueta: 'Chaqueta' } },
  bottom:  { label: 'Parte inferior', tab: 'Inferior', types: { pantalon: 'Pantalón', short: 'Short', falda: 'Falda', faldaLarga: 'Falda larga' } },
  dress:   { label: 'Vestidos', tab: 'Vestidos', types: { vestidoCorto: 'Vestido corto', vestidoLargo: 'Vestido largo' } },
  shoes:   { label: 'Calzado', tab: 'Calzado', types: { zapatillas: 'Zapatillas', botas: 'Botas', tacones: 'Tacones' } },
  glasses: { label: 'Lentes', tab: 'Lentes', types: { redondos: 'Redondos', cuadrados: 'Cuadrados', sol: 'De sol' } },
  hat:     { label: 'Gorras y sombreros', tab: 'Gorras', types: { gorra: 'Gorra', sombrero: 'Sombrero', boina: 'Boina' } },
};
const COLOR_ONLY = new Set(['glasses']);
const OCCS = { casual: 'Casual', trabajo: 'Trabajo', cita: 'Cita', fiesta: 'Fiesta' };
const CLIMAS = { calor: 'Calor', templado: 'Templado', frio: 'Frío' };
// Etiquetas sugeridas por tipo de prenda (ella puede cambiarlas al subirla).
const TYPE_TAGS = {
  camiseta: [['casual'], ['calor', 'templado']], blusa: [['trabajo', 'cita'], ['calor', 'templado']],
  crop: [['casual', 'fiesta'], ['calor']], chaqueta: [['casual', 'trabajo'], ['frio', 'templado']],
  pantalon: [['casual', 'trabajo', 'cita'], ['templado', 'frio']], short: [['casual'], ['calor']],
  falda: [['casual', 'cita'], ['calor', 'templado']], faldaLarga: [['trabajo', 'cita', 'fiesta'], ['templado', 'frio']],
  vestidoCorto: [['cita', 'fiesta'], ['calor', 'templado']], vestidoLargo: [['cita', 'fiesta'], ['templado', 'calor']],
  zapatillas: [['casual'], ['calor', 'templado', 'frio']], botas: [['casual', 'trabajo', 'cita'], ['frio', 'templado']],
  tacones: [['trabajo', 'cita', 'fiesta'], ['calor', 'templado']],
  redondos: [['casual', 'trabajo'], ['calor', 'templado', 'frio']], cuadrados: [['casual', 'trabajo'], ['calor', 'templado', 'frio']],
  sol: [['casual'], ['calor']], gorra: [['casual'], ['calor']], sombrero: [['casual', 'cita'], ['calor']], boina: [['casual', 'cita'], ['frio', 'templado']],
};

/* ---------------- Almacenamiento local (IndexedDB) ---------------- */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('probador3d', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('items', { keyPath: 'id' });
        d.createObjectStore('looks', { keyPath: 'id' });
        d.createObjectStore('prefs');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const run = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    all: s => run(s, 'readonly', st => st.getAll()).catch(() => []),
    get: (s, k) => run(s, 'readonly', st => st.get(k)).catch(() => null),
    put: (s, v, k) => run(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)).catch(() => null),
    del: (s, k) => run(s, 'readwrite', st => st.delete(k)).catch(() => null),
  };
})();

/* ---------------- Escena ---------------- */
const viewer = $('#viewer');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewer.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
camera.position.set(0, 1.0, 3.9);
const controls = new OrbitControls(camera, renderer.domElement);

function addGlasses(item, round, dark) {
  const g = new THREE.Group();

  const rr = round ? (dark ? 0.028 : 0.024) : 0.028, segs = round ? 40 : 4;
  for (const s of [-1, 1]) {
    const ring = mesh(new THREE.TorusGeometry(rr, 0.0032, 10, segs), frame);
    const l = new THREE.Mesh(new THREE.CircleGeometry(rr, segs), lens);
    for (const o of [ring, l]) { o.position.x = s * 0.036; if (!round) o.rotation.z = Math.PI / 4; }
    l.position.z = -0.001;
    const temple = mesh(new THREE.BoxGeometry(0.004, 0.004, 0.115), frame);
    temple.position.set(s * 0.077, 0.004, -0.055);
    temple.rotation.y = -s * 0.28;
    g.add(ring, l, temple);
  }
  const bridge = mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 0.026, 8), frame);
  bridge.rotation.z = Math.PI / 2;
  bridge.position.y = 0.006;

}

/* ---------------- Proyección de la foto completa ----------------
   La foto del frente se proyecta de frente sobre la prenda y la de la espalda por detrás,
   como si se colocara la prenda real sobre la modelo. Textura: mitad izquierda = frente, derecha = espalda. */
function projectUV(id) {
  model.updateMatrixWorld(true);
  const meshes = [];
  for (const g of Object.values(W)) g.traverse(o => { if (o.isMesh && o.userData.item === id) meshes.push(o); });
  const box = new THREE.Box3(), v = new THREE.Vector3();
  const world = meshes.map(m => {
    if (m.geometry.index) { const g = m.geometry.toNonIndexed(); m.geometry.dispose(); m.geometry = g; }
    const pos = m.geometry.attributes.position, w = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld);
      w[i * 3] = v.x; w[i * 3 + 1] = v.y; w[i * 3 + 2] = v.z;
      box.expandByPoint(v);
    }
    return [m, w];
  });
  const min = box.min, size = box.getSize(new THREE.Vector3()), cz = (box.min.z + box.max.z) / 2;
  for (const [m, w] of world) {
    const n = w.length / 3, uv = new Float32Array(n * 2);
    for (let t = 0; t < n; t += 3) {
      const front = (w[t * 3 + 2] + w[t * 3 + 5] + w[t * 3 + 8]) / 3 >= cz;
      for (let k = 0; k < 3; k++) {
        const i = t + k;
        const u = (w[i * 3] - min.x) / (size.x || 1), vv = (w[i * 3 + 1] - min.y) / (size.y || 1);
        uv[i * 2] = front ? 0.004 + u * 0.488 : 0.508 + (1 - u) * 0.488;
        uv[i * 2 + 1] = vv;
      }
    }
    m.geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  }
}

const glbCache = new Map();
const gltfLoader = new GLTFLoader();
function getGlb(item) {
  if (!glbCache.has(item.id)) {
    glbCache.set(item.id, new Promise((res, rej) => gltfLoader.parse(item.glb.slice(0), '', gltf => {
      const wrap = new THREE.Group();
      wrap.add(gltf.scene);
      wrap.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(wrap);
      const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
      const f = FIT[item.cat];
      const s = f.h ? f.h / (size.y || 1) : f.w / (size.x || 1);
      wrap.scale.setScalar(s);
      wrap.position.set(-c.x * s, f.y - c.y * s, (f.z || 0) - c.z * s);
      wrap.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      res(wrap);
    }, rej)));
  }
  return glbCache.get(item.id);
}

function swatchCanvas(kind, color) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  const noise = (n, a, b) => { for (let i = 0; i < n; i++) { x.fillStyle = Math.random() < 0.5 ? a : b; x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); } };
  if (kind === 'stripes') {
    x.fillStyle = '#f5f2ec'; x.fillRect(0, 0, 256, 256);
    x.fillStyle = '#1f2a44';
    for (let y = 0; y < 256; y += 32) x.fillRect(0, y, 256, 12);
    noise(1500, 'rgba(0,0,0,.05)', 'rgba(255,255,255,.08)');
  } else if (kind === 'denim') {
    x.fillStyle = '#3f5c82'; x.fillRect(0, 0, 256, 256);
    x.strokeStyle = 'rgba(255,255,255,.07)'; x.lineWidth = 1;
    for (let i = -256; i < 256; i += 4) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 256, 256); x.stroke(); }
    noise(6000, 'rgba(10,20,40,.18)', 'rgba(200,215,235,.12)');
  } else if (kind === 'floral') {
    x.fillStyle = '#e9a7b5'; x.fillRect(0, 0, 256, 256);
    for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
      const cx = gx * 64 + 32 + (gy % 2) * 20 - 10, cy = gy * 64 + 32;
      x.fillStyle = '#fff4ef';
      for (let p = 0; p < 5; p++) { const a = p / 5 * Math.PI * 2; x.beginPath(); x.arc(cx + Math.cos(a) * 9, cy + Math.sin(a) * 9, 7, 0, 7); x.fill(); }
      x.fillStyle = '#e8b54a'; x.beginPath(); x.arc(cx, cy, 5, 0, 7); x.fill();
      x.fillStyle = '#5f8a5a'; x.beginPath(); x.ellipse(cx + 18, cy + 14, 7, 3, 0.6, 0, 7); x.fill();
    }
  } else {
    x.fillStyle = color; x.fillRect(0, 0, 256, 256);
    noise(2500, 'rgba(0,0,0,.05)', 'rgba(255,255,255,.06)');
  }
  return c;
}

// Recorta la prenda: quita el fondo liso conectado a los bordes y encuadra lo que queda.
function cutout(img, removeBg) {
  const s = Math.min(1, 512 / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, w, h);
  const data = x.getImageData(0, 0, w, h), d = data.data;
  const bg = new Uint8Array(w * h);
  if (removeBg) {
    let R = 0, G = 0, B = 0, n = 0;
    const add = i => { R += d[i * 4]; G += d[i * 4 + 1]; B += d[i * 4 + 2]; n++; };
    for (let X = 0; X < w; X++) { add(X); add((h - 1) * w + X); }
    for (let Y = 0; Y < h; Y++) { add(Y * w); add(Y * w + w - 1); }
    R /= n; G /= n; B /= n;
    const close = i => { const a = d[i * 4] - R, b = d[i * 4 + 1] - G, c2 = d[i * 4 + 2] - B; return a * a + b * b + c2 * c2 < 3025; };
    const stack = [];
    const push = i => { if (!bg[i] && close(i)) { bg[i] = 1; stack.push(i); } };
    for (let X = 0; X < w; X++) { push(X); push((h - 1) * w + X); }
    for (let Y = 0; Y < h; Y++) { push(Y * w); push(Y * w + w - 1); }
    while (stack.length) {
      const i = stack.pop(), X = i % w;
      if (X > 0) push(i - 1);
      if (X < w - 1) push(i + 1);
      if (i >= w) push(i - w);
      if (i < w * (h - 1)) push(i + w);
    }
    let cnt = 0;
    for (let i = 0; i < bg.length; i++) cnt += bg[i];
    if (cnt < bg.length * 0.03 || cnt > bg.length * 0.95) bg.fill(0);
  }
  let minX = w, minY = h, maxX = -1, maxY = -1, r = 0, g = 0, b = 0, m = 0;
  for (let i = 0; i < bg.length; i++) {
    if (bg[i]) { d[i * 4 + 3] = 0; continue; }
    const X = i % w, Y = (i / w) | 0;
    if (X < minX) minX = X; if (X > maxX) maxX = X; if (Y < minY) minY = Y; if (Y > maxY) maxY = Y;
    r += d[i * 4]; g += d[i * 4 + 1]; b += d[i * 4 + 2]; m++;
  }
  x.putImageData(data, 0, 0);
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const prev = document.createElement('canvas');
  prev.width = cw; prev.height = ch;
  prev.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, cw, ch);
  const color = hexOf(r / m, g / m, b / m);
  const fill = document.createElement('canvas');
  fill.width = cw; fill.height = ch;
  const fx = fill.getContext('2d');
  fx.fillStyle = color;
  fx.fillRect(0, 0, cw, ch);
  fx.drawImage(prev, 0, 0);
  return { preview: prev.toDataURL('image/png'), fill, color };
}

// Arma las texturas de una prenda a partir de sus fotos.
function buildTextures(front, back) {
  const proj = document.createElement('canvas');
  proj.width = 1024; proj.height = 512;
  const px = proj.getContext('2d');
  px.drawImage(front.fill, 0, 0, 512, 512);
  px.drawImage((back || front).fill, 512, 0, 512, 512);
  const f = front.fill, side = Math.min(f.width, f.height) * 0.5;
  const tile = document.createElement('canvas');
  tile.width = tile.height = 512;
  tile.getContext('2d').drawImage(f, (f.width - side) / 2, (f.height - side) / 2, side, side, 0, 0, 512, 512);
  return { proj: proj.toDataURL('image/jpeg', 0.88), tex: tile.toDataURL('image/jpeg', 0.85) };
}

/* ---------------- Uso de prendas (para no repetir) ---------------- */
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dayKey(new Date());
const DAY_MS = 86400000;
const fmtDay = k => fromKey(k).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'short' });
// Veces usada y último uso, contando solo los días ya pasados o de hoy en el plan.
function usage(id) {
  let count = 0, last = null;
  const t = todayKey();
  for (const [k, p] of Object.entries(plans)) {
    if (k > t || !Object.values(p.worn).includes(id)) continue;
    count++;
    if (!last || k > last) last = k;
  }
  return { count, last };
}
const signature = w => ['top', 'bottom', 'dress'].map(c => w[c] || '-').join('|');
// ¿Este conjunto ya está en el plan dentro de 14 días alrededor de la fecha?
function repeatNear(w, key) {
  const sig = signature(w), t = fromKey(key).getTime();
  return Object.keys(plans).filter(k => k !== key && signature(plans[k].worn) === sig && Math.abs(fromKey(k).getTime() - t) <= 14 * DAY_MS).sort();
}
async function savePlans() { await DB.put('prefs', plans, 'plans'); }
async function planDay(key, w, thumb) {
  plans[key] = { worn: { ...w }, thumb };
  await savePlans();
  const rep = repeatNear(w, key);
  toast(rep.length ? `Planeado. Ojo: ya llevas este look el ${fmtDay(rep[0])}.` : `Planeado para el ${fmtDay(key)}.`);
}

/* ---------------- Estilista: arma looks con su armario ---------------- */
function hsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return { h: 0, s: 0, l };
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: h * 60, s, l };
}
const isNeutral = c => c.s < 0.2 || c.l < 0.16 || c.l > 0.88;
// Qué tan bien combinan dos colores (0–1): neutros con todo, análogos y complementarios bien.
function harmony(a, b) {
  const x = hsl(a), y = hsl(b);
  if (isNeutral(x) || isNeutral(y)) return 1;
  const d = Math.min(Math.abs(x.h - y.h), 360 - Math.abs(x.h - y.h));
  if (d < 25) return 0.75;
  if (d > 150) return 0.9;
  if (d < 60) return 0.8;
  return 0.4;
}
const fits = (it, occ, clima) => (!occ || !it.occ?.length || it.occ.includes(occ)) && (!clima || !it.clima?.length || it.clima.includes(clima));
function poolFor(cat, occ, clima) {
  const all = items.filter(i => i.cat === cat);
  let p = all.filter(i => fits(i, occ, clima));
  if (!p.length) p = all.filter(i => fits(i, '', clima));
  return p;
}
// Prendas que no usa hace tiempo pesan más: así no repite outfits.
function freshness(id) {
  const { last } = usage(id);
  if (!last) return 2;
  const days = (Date.now() - fromKey(last).getTime()) / DAY_MS;
  return 0.3 + Math.min(days, 21) / 12;
}
function pick(pool, score = () => 1) {
  if (!pool.length) return null;
  const w = pool.map(i => Math.max(0.01, freshness(i.id) * score(i) * (0.6 + Math.random() * 0.8)));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function suggest(occ, clima) {
  const prev = lastSuggestion && signature(lastSuggestion);
  let best = null;
  for (let tries = 0; tries < 12; tries++) {
    const out = { top: null, bottom: null, dress: null, shoes: null, glasses: null, hat: null };
    const tops = poolFor('top', occ, clima), bottoms = poolFor('bottom', occ, clima), dresses = poolFor('dress', occ, clima);
    const useDress = dresses.length && (!tops.length || !bottoms.length || Math.random() < 0.35);
    let base;
    if (useDress) { base = pick(dresses); out.dress = base.id; }
    else {
      base = pick(tops);
      const bottom = base && pick(bottoms, b => harmony(base.color, b.color));
      out.top = base?.id || null;
      out.bottom = bottom?.id || null;
    }
    const shoe = pick(poolFor('shoes', occ, clima), s => base ? harmony(base.color, s.color) : 1);
    out.shoes = shoe?.id || null;
    if (Math.random() < (clima === 'calor' ? 0.55 : 0.25)) out.glasses = pick(poolFor('glasses', occ, clima))?.id || null;
    if (Math.random() < (clima === 'calor' ? 0.4 : 0.15)) out.hat = pick(poolFor('hat', occ, clima))?.id || null;
    best = out;
    if (signature(out) !== prev) break;
  }
  return best;
}
function stylistReason(w) {
  const list = Object.values(w).filter(Boolean).map(itemById).filter(Boolean);
  const unused = list.filter(i => !usage(i.id).count && !i.sample);
  if (unused.length) return `Incluye ${unused.length === 1 ? 'una prenda tuya que aún no has usado' : `${unused.length} prendas tuyas que aún no has usado`}.`;
  const old = list.map(i => usage(i.id).last).filter(Boolean).sort()[0];
  return old ? `Prioricé prendas que no usas desde el ${fmtDay(old)}.` : 'Combiné colores que van bien juntos.';
}

  if (wk) { weekOffset += +wk.dataset.week; renderPane(); }
});

/* ---------------- Semana: planear outfits ---------------- */
function renderWeekPane(pane) {
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) + weekOffset * 7);
  const days = Array.from({ length: 7 }, (_, i) => dayKey(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i)));
  const t = todayKey();
  const range = `${fromKey(days[0]).toLocaleDateString('es', { day: 'numeric', month: 'short' })} – ${fromKey(days[6]).toLocaleDateString('es', { day: 'numeric', month: 'short' })}`;
  const past = Object.keys(plans).filter(k => k <= t);
  const mineIds = items.filter(i => !i.sample).map(i => i.id);
  const usedIds = new Set(past.flatMap(k => Object.values(plans[k].worn)));
  const forgotten = mineIds.filter(id => !usedIds.has(id)).length;
  const sigs = past.map(k => signature(plans[k].worn));
  pane.innerHTML = `
    <div class="pane-head"><h2>Mi semana</h2><p>Planea qué ponerte cada día. Te aviso si repites un look en menos de dos semanas.</p></div>
    <div class="stat">
      <div><b>${past.length}</b><span>días vestidos</span></div>
      <div><b>${new Set(sigs).size}</b><span>looks distintos</span></div>
      <div><b>${forgotten}</b><span>prendas tuyas sin usar</span></div>
    </div>
    <div class="week-nav">
      <button type="button" class="btn small" data-week="-1" aria-label="Semana anterior">‹ Anterior</button>
      <strong>${range}</strong>
      <button type="button" class="btn small" data-week="1" aria-label="Semana siguiente">Siguiente ›</button>
    </div>
    <div class="days">${days.map(k => {
      const p = plans[k], d = fromKey(k);
      const names = p ? Object.values(p.worn).filter(Boolean).map(itemById).filter(Boolean).map(i => esc(i.name)).join(' · ') : '';
      const rep = p ? repeatNear(p.worn, k) : [];
      return `<div class="day${k === t ? ' today' : ''}">
        <div class="dt"><span>${d.toLocaleDateString('es', { weekday: 'short' }).replace('.', '')}</span><b>${d.getDate()}</b></div>
        ${p ? `<img class="ph" src="${p.thumb}" alt="">` : '<div class="ph" aria-hidden="true">+</div>'}
        <div>
          <p>${p ? names || 'Sin prendas' : k === t ? 'Hoy, sin planear' : 'Sin planear'}${rep.length ? `<br><span class="warn">Repite el look del ${fmtDay(rep[0])}</span>` : ''}</p>
          <div class="acts">${p
            ? `<button type="button" class="btn small" data-wearday="${k}">Ver en la modelo</button><button type="button" class="btn small" data-plan="${k}">Cambiar por el actual</button><button type="button" class="btn small" data-unplan="${k}">Quitar</button>`
            : `<button type="button" class="btn small" data-plan="${k}">Planear con el look actual</button>`}</div>
        </div>
      </div>`;
    }).join('')}</div>`;
}

/* ---------------- Giro 360° ---------------- */
const angle = $('#angle'), angleOut = $('#angleOut'), spinBtn = $('#spin');
let tween = null;
const azDeg = () => ((THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()) % 360) + 360) % 360;
function setAzimuth(deg) {
  const off = camera.position.clone().sub(controls.target);
  const sph = new THREE.Spherical().setFromVector3(off);
  sph.theta = THREE.MathUtils.degToRad(deg);
  off.setFromSpherical(sph);
  camera.position.copy(controls.target).add(off);
  controls.update();
}
function goTo(deg) {
  stopSpin();
  const from = azDeg();
  let delta = ((deg - from + 540) % 360) - 180;
  if (reduceMotion) return setAzimuth(deg);
  tween = { from, delta, t0: performance.now(), dur: 650 };
}
function stopSpin() { controls.autoRotate = false; spinBtn.setAttribute('aria-pressed', 'false'); }
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.view)));
spinBtn.addEventListener('click', () => {
  const on = !controls.autoRotate;
  tween = null;
  controls.autoRotate = on;
  spinBtn.setAttribute('aria-pressed', String(on));
});
angle.addEventListener('input', () => { stopSpin(); tween = null; setAzimuth(+angle.value); });
controls.addEventListener('start', () => { tween = null; });
controls.addEventListener('change', () => {
  const d = Math.round(azDeg()) % 360;
  angle.value = d;
  angleOut.textContent = `${d}°`;
});

renderer.setAnimationLoop(now => {
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur);
    const e = 1 - Math.pow(1 - k, 3);
    setAzimuth(tween.from + tween.delta * e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});

/* ---------------- Avisos ---------------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------------- Inicio ---------------- */
async function init() {
  const [mine, prefs, savedLooks, savedPlans] = await Promise.all([DB.all('items'), DB.get('prefs', 'state'), DB.all('looks'), DB.get('prefs', 'plans')]);
  plans = savedPlans || {};
  items = [...SAMPLES, ...(mine || []).sort((a, b) => a.created - b.created)];
  looks = savedLooks || [];
  if (prefs) {
    if (prefs.look) look = { ...look, ...prefs.look };
    if (prefs.worn) worn = { ...worn, ...prefs.worn };
  }
  for (const k in worn) if (worn[k] && !itemById(worn[k])) worn[k] = null;
  resize();
  try { await loadAvatar(); }
  catch { $('#loading').textContent = 'No se pudo cargar la modelo. Revisa tu conexión y vuelve a abrir la página.'; return; }
  applyModel();
  renderTabs();
  renderPane();
  await applyOutfit();
  $('#loading').remove();
}
init();
</script>
